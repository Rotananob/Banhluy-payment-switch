services:
  postgres:
    image: postgres:15-alpine
    container_name: banhluy-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: banhluy
      POSTGRES_PASSWORD: banhluy_dev
      POSTGRES_DB: banhluy
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U banhluy -d banhluy']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
